<section class="auth-wrapper">
  <div class="card">
    <h2>Crear cuenta</h2>
    <p class="subtitle">Auto-registro disponible para Pacientes y Dirección General.</p>

    <div class="tabs">
      <button type="button" class="tab-btn" ng-class="{active: tipoRegistro === 'PACIENTE'}" ng-click="cambiarTipoRegistro('PACIENTE')">
        Paciente
      </button>
      <button type="button" class="tab-btn" ng-class="{active: tipoRegistro === 'DIRECTOR_GENERAL'}" ng-click="cambiarTipoRegistro('DIRECTOR_GENERAL')">
        Director General
      </button>
    </div>

    <div class="alert alert-error" ng-if="error">{{ error }}</div>
    <div class="alert alert-success" ng-if="mensaje">{{ mensaje }}</div>

    <form ng-submit="enviarRegistro()">
      <div class="form-group">
        <label for="reg-nombre">Nombre completo</label>
        <input id="reg-nombre" type="text" ng-model="registro.nombre" required>
      </div>

      <div class="form-group" ng-if="tipoRegistro === 'PACIENTE'">
        <label for="reg-curp">CURP</label>
        <input id="reg-curp" type="text" ng-model="registro.curp" maxlength="18" minlength="18" required placeholder="18 caracteres">
      </div>

      <div class="form-group">
        <label for="reg-telefono">Teléfono</label>
        <input id="reg-telefono" type="tel" ng-model="registro.telefono" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="reg-correo">Correo electrónico</label>
        <input id="reg-correo" type="email" ng-model="registro.correo" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input id="reg-password" type="password" ng-model="registro.password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" ng-disabled="cargando">
        {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="subtitle text-center mt-1">
      ¿Ya tienes cuenta? <a href="#!/login">Inicia sesión</a>
    </p>
  </div>
</section>
